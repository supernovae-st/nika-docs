# SPDX-License-Identifier: Apache-2.0
# Docs gate · run `lefthook install` once per clone.
#
# pre-push runs the two checks that actually catch docs breakage:
#   mint broken-links — the ONLY check that parses MDX for real (a bare
#     brace in a generated table killed the build once · 2026-06-11) ·
#     soft-skips when the mint CLI is absent (CI installs it · a clone
#     without it still pushes, with a warning).
#   link-audit — fast internal-link + asset audit (python3 · always on).

pre-push:
  parallel: false
  commands:
    mint-broken-links:
      run: >
        sh -c 'command -v mint >/dev/null 2>&1
        && mint broken-links
        || echo "⚠ mint CLI absent — MDX-parse gate SKIPPED (install: npm i -g mint)"'
    link-audit:
      run: python3 scripts/link-audit.py
    sdk-contract:
      run: python3 scripts/sdk_contract_gate.py
    teach-parity:
      # the inverse of oracle-sweep: every RELEASED subcommand has a
      # reference/cli.mdx row (soft-skips when the binary is absent)
      run: python3 scripts/teach-parity.py
    oracle-sweep:
      # every full yaml workflow block must run on the RELEASED binary — the
      # same judge CI uses (local/CI judge parity · the sibling-spec probe
      # died with the wrong-judge fix; the script itself soft-exits 2 when
      # no `nika` is on PATH, so the guard is the script's, not the hook's)
      run: python3 scripts/oracle-sweep.py
