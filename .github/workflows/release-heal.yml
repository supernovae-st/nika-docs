name: release-heal

# Resolve and verify one published stable release, project it atomically, then
# propose the generated surfaces through a normal PR, dispatch all docs gates,
# and merge the exact passing commit. Main protection applies.
# The projection independently reads latest: if it moves after installation,
# its tag/build check fails before replacing any snapshot bytes.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI and approve the exact held pull_request gate for GITHUB_TOKEN-created proposals
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the verified published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install_release.py --dest "$RUNNER_TEMP/nika-release" >> "$GITHUB_ENV"
      - name: Project and validate the selected release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PATH="$(dirname "$NIKA_BIN"):$PATH"
          export PATH
          python3 scripts/release_catalog.py --refresh
          bash scripts/mintlify-snapshot.sh
          python3 scripts/release_catalog.py --refresh --check
          python3 scripts/tests/test_release_catalog.py
          python3 scripts/publication-audit.py
          python3 scripts/link-audit.py
          python3 scripts/sdk_contract_gate.py
          python3 scripts/count-drift-gate.py | tee "$RUNNER_TEMP/count-drift.out"
          if grep -q 'skipped' "$RUNNER_TEMP/count-drift.out"; then
            echo '::error::count-drift skipped despite the verified install'
            exit 1
          fi
          python3 scripts/teach-parity.py | tee "$RUNNER_TEMP/teach-parity.out"
          if grep -q 'SKIP' "$RUNNER_TEMP/teach-parity.out"; then
            echo '::error::teach-parity skipped despite the verified install'
            exit 1
          fi
          python3 scripts/oracle-sweep.py
      - name: Refresh generated provenance
        run: |
          git add snippets/_status-snapshot.mdx snippets/data/releases.json changelog/releases.mdx
          python3 scripts/estate.py --write
          python3 scripts/estate.py --check
      - name: Propose, qualify and merge generated release changes
        # Explicit workflow_dispatch runs all gates on the proposed commit; the
        # pull_request gate is created held, so the script approves that exact
        # run only after re-validating the same-repo generated-only identity.
        # Both gates and every required job must succeed before the REST merge,
        # which pins that commit and honors main branch protection.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_proposal.py
