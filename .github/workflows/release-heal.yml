name: release-heal

# Resolve and verify one published stable release, project it atomically, then
# propose the validated snapshot through a normal PR. Main protection applies.
# The projection independently reads latest: if it moves after installation,
# its tag/build check fails before replacing any snapshot bytes.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-heal
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the verified published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/install_release.py --dest "$RUNNER_TEMP/nika-release" >> "$GITHUB_ENV"
      - name: Project and validate the selected release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PATH="$(dirname "$NIKA_BIN"):$PATH"
          export PATH
          bash scripts/mintlify-snapshot.sh
          python3 scripts/link-audit.py
          python3 scripts/sdk_contract_gate.py
          python3 scripts/count-drift-gate.py | tee "$RUNNER_TEMP/count-drift.out"
          if grep -q 'skipped' "$RUNNER_TEMP/count-drift.out"; then
            echo '::error::count-drift skipped despite the verified install'
            exit 1
          fi
          python3 scripts/teach-parity.py | tee "$RUNNER_TEMP/teach-parity.out"
          if grep -q 'SKIP' "$RUNNER_TEMP/teach-parity.out"; then
            echo '::error::teach-parity skipped despite the verified install'
            exit 1
          fi
          python3 scripts/oracle-sweep.py
      - name: Propose the validated snapshot through main protection
        # GITHUB_TOKEN-created PRs do not trigger a second workflow run.
        # The checks above are local proof; a reviewer must arrange any further
        # required CI/review through the normal policy path before merging.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- snippets/_status-snapshot.mdx && { echo 'snapshot already current'; exit 0; }
          branch="nika-release-heal/$NIKA_TAG"
          # An existing proposal stays with its reviewers. Never force-push it.
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq 'length')"
          if [ "$existing" != 0 ]; then
            echo "proposal for $NIKA_TAG already open"
            exit 0
          fi
          git switch -c "$branch"
          git config user.name 'nika-release[bot]'
          git config user.email 'nika@supernovae.studio'
          git add snippets/_status-snapshot.mdx
          git commit -m "chore(status): project verified $NIKA_TAG" \
            -m 'Co-Authored-By: Nika 🦋 <nika@supernovae.studio>'
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/release-heal-pr.md" <<EOF
          Project the five status fields from the checksum- and attestation-verified $NIKA_TAG binary.

          Validation: link audit, SDK contract, count drift, teach parity, and released-binary oracle sweep.
          This proposal requires the repository's normal review and merge checks.
          EOF
          gh pr create --head "$branch" --base main \
            --title "chore(status): project verified $NIKA_TAG" \
            --body-file "$RUNNER_TEMP/release-heal-pr.md"
