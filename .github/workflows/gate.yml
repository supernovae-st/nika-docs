name: gate

# The docs repo's own drift gate — runs the same checks the monorepo
# prober enforces, but at PUSH TIME (detection latency ≈ 0 instead of
# "whenever someone runs the full hygiene sweep from the monorepo").
# Checks: internal links resolve · every page in docs.json nav ·
# no dead-branch refs (nika-diamond → main) · no legacy {{ }} bindings ·
# every full ```yaml workflow block validates against the spec oracle
# (the pre-push hook ran this locally, but a web-UI edit or API commit
# skipped it — CI closes that door).
# No untrusted event input is interpolated anywhere in this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: link + canon audit
        run: python3 scripts/link-audit.py
      # the estate manifest re-emits and byte-compares — a red here means a
      # PR changed tracked files without `python3 scripts/estate.py --write`.
      - name: Estate manifest observes (non-blocking · E0)
        continue-on-error: true
        run: python3 scripts/estate.py --check
      # count-drift check (c) asserts hand-typed MCP tool counts against the
      # live wire — without a binary it self-skips, so CI was only running
      # checks (a)+(b) while the wire assertion lived local-only. Install the
      # latest release the same checksum-verified way the marketplace gate
      # does: no bare curl|tar.
      - name: install nika (latest release · checksum-verified)
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -o /dev/null -w '%{url_effective}'             https://github.com/supernovae-st/nika/releases/latest | sed 's|.*/tag/||')
          ver=${tag#v}
          dl="https://github.com/supernovae-st/nika/releases/download/${tag}"
          asset="nika-linux-x64-${ver}.tar.gz"
          curl -fsSL "${dl}/${asset}" -o "${asset}"
          curl -fsSL "${dl}/SHA256SUMS" -o SHA256SUMS
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "${asset}"
          sudo mv nika /usr/local/bin/nika
          nika --version
      # shell: bash turns on pipefail — without it the default `bash -e {0}`
      # lets `tee` swallow the gate's red exit code (the verdict must never
      # ride a pipe unprotected).
      - name: count-drift gate (wire-asserted)
        shell: bash
        run: |
          python3 scripts/count-drift-gate.py | tee /tmp/cdg.out
          if grep -q "skipped" /tmp/cdg.out; then
            echo "::error::tool-count check skipped despite the install — wire assertion did not run"
            exit 1
          fi
      # teach-parity is the inverse of oracle-sweep: it proves every RELEASED
      # subcommand has a reference/cli.mdx row. It soft-skips without a
      # binary — the install above makes a skip here a wiring failure, so a
      # skip fails loudly instead of passing quietly.
      - name: teach-parity gate (released-subcommand coverage)
        shell: bash
        run: |
          python3 scripts/teach-parity.py | tee /tmp/tp.out
          if grep -q "SKIP" /tmp/tp.out; then
            echo "::error::teach-parity skipped despite the install — the released-binary derivation did not run"
            exit 1
          fi
          python3 scripts/tests/test_teach_parity_retired_new.py

  oracle-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The fence judge is the RELEASED binary — docs are a baked visitor
      # surface, and what a reader copies must run on THEIR installed nika.
      # (The spec oracle judges the PACK in the spec repo's own CI; judging
      # a served surface against spec HEAD is the wrong judge — that is how
      # 56 fences stayed green while broken on every installed binary.)
      - name: install nika (latest release · checksum-verified)
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/supernovae-st/nika/releases/latest | sed 's|.*/tag/||')
          ver=${tag#v}
          dl="https://github.com/supernovae-st/nika/releases/download/${tag}"
          asset="nika-linux-x64-${ver}.tar.gz"
          curl -fsSL "${dl}/${asset}" -o "${asset}"
          curl -fsSL "${dl}/SHA256SUMS" -o SHA256SUMS
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "${asset}"
          sudo mv nika /usr/local/bin/nika
          nika --version
      - name: every docs yaml block runs on the released binary
        run: python3 scripts/oracle-sweep.py
      # Cliquet: a planted `nika: v1` project fence must stay red on the
      # held binary. Without this, the seventh page re-teaches the retired
      # schema tag and oracle-sweep only notices after a reader copies it.
      - name: retired nika: v1 project tag stays red
        run: python3 scripts/tests/test_oracle_sweep_retired_v1_tag.py
      # The spec clone below serves ONLY the design-token parity check.
      # clock: ratified-HEAD · because the docs THEME follows the spec design
      # pack as ratified — an accepted, advisory drift signal (a spec-side
      # token merge may flag here before docs re-theme). Advisory means
      # advisory: continue-on-error keeps a floating judge from blocking the
      # gate (the clock-sweep caught the comment/behavior mismatch 2026-07-20).
      - name: fetch the spec (design parity only)
        run: git clone --depth 1 https://github.com/supernovae-st/nika-spec ../spec
      - name: projector deps (pyyaml · jsonschema)
        run: pip install pyyaml jsonschema
      - name: docs.json theme parity vs the design-tokens SSOT (advisory)
        continue-on-error: true
        env:
          NIKA_DOCS_ROOT: ${{ github.workspace }}
        run: python3 ../spec/scripts/design-projector.py --check

  mirror:
    name: The estate tool is the shared one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: scripts/estate.py is byte-identical to nika-estate at the pinned rev
        run: |
          pin="$(grep -v '^#' ESTATE_PIN | head -1 | tr -d '[:space:]')"
          url="https://raw.githubusercontent.com/supernovae-st/nika-estate/${pin}/scripts/estate.py"
          curl -fsSL "$url" -o /tmp/estate-canonical.py
          if ! cmp -s /tmp/estate-canonical.py scripts/estate.py; then
            echo "::error file=scripts/estate.py::diverges from nika-estate@${pin} — the tool is shared: change it upstream, bump ESTATE_PIN, re-mirror"
            diff -u /tmp/estate-canonical.py scripts/estate.py | head -60
            exit 1
          fi
          if [ ! -x scripts/estate.py ]; then
            echo "::error file=scripts/estate.py::has a shebang but is not executable · cmp compares content and raw.githubusercontent serves no modes, so the mirror carries the bit itself"
            exit 1
          fi
          echo "✓ scripts/estate.py is byte-identical to nika-estate@${pin} and executable"
