name: gate

# The docs repo's own drift gate — runs the same checks the monorepo
# prober enforces, but at PUSH TIME (detection latency ≈ 0 instead of
# "whenever someone runs the full hygiene sweep from the monorepo").
# Checks: internal links resolve · every page in docs.json nav ·
# no dead-branch refs (nika-diamond → main) · no legacy {{ }} bindings ·
# every full ```yaml workflow block validates against the spec oracle
# (the pre-push hook ran this locally, but a web-UI edit or API commit
# skipped it — CI closes that door).
# No untrusted event input is interpolated anywhere in this workflow.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: link + canon audit
        run: python3 scripts/link-audit.py
      # count-drift check (c) asserts hand-typed MCP tool counts against the
      # live wire — without a binary it self-skips, so CI was only running
      # checks (a)+(b) while the wire assertion lived local-only. Install the
      # latest release the same checksum-verified way the marketplace gate
      # does: no bare curl|tar.
      - name: install nika (latest release · checksum-verified)
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -o /dev/null -w '%{url_effective}'             https://github.com/supernovae-st/nika/releases/latest | sed 's|.*/tag/||')
          ver=${tag#v}
          dl="https://github.com/supernovae-st/nika/releases/download/${tag}"
          asset="nika-linux-x64-${ver}.tar.gz"
          curl -fsSL "${dl}/${asset}" -o "${asset}"
          curl -fsSL "${dl}/SHA256SUMS" -o SHA256SUMS
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "${asset}"
          sudo mv nika /usr/local/bin/nika
          nika --version
      - name: count-drift gate (wire-asserted)
        run: |
          python3 scripts/count-drift-gate.py | tee /tmp/cdg.out
          if grep -q "skipped" /tmp/cdg.out; then
            echo "::error::tool-count check skipped despite the install — wire assertion did not run"
            exit 1
          fi

  oracle-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      # The fence judge is the RELEASED binary — docs are a baked visitor
      # surface, and what a reader copies must run on THEIR installed nika.
      # (The spec oracle judges the PACK in the spec repo's own CI; judging
      # a served surface against spec HEAD is the wrong judge — that is how
      # 56 fences stayed green while broken on every installed binary.)
      - name: install nika (latest release · checksum-verified)
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
            https://github.com/supernovae-st/nika/releases/latest | sed 's|.*/tag/||')
          ver=${tag#v}
          dl="https://github.com/supernovae-st/nika/releases/download/${tag}"
          asset="nika-linux-x64-${ver}.tar.gz"
          curl -fsSL "${dl}/${asset}" -o "${asset}"
          curl -fsSL "${dl}/SHA256SUMS" -o SHA256SUMS
          grep " ${asset}\$" SHA256SUMS | sha256sum -c -
          tar xzf "${asset}"
          sudo mv nika /usr/local/bin/nika
          nika --version
      - name: every docs yaml block runs on the released binary
        run: python3 scripts/oracle-sweep.py
      # The spec clone below serves ONLY the design-token parity check.
      # Pin debt (known): it tracks spec HEAD — tokens drift slowly and the
      # check is advisory-shaped; the fence judge above no longer does.
      - name: fetch the spec (design parity only)
        run: git clone --depth 1 https://github.com/supernovae-st/nika-spec ../spec
      - name: projector deps (pyyaml · jsonschema)
        run: pip install pyyaml jsonschema
      - name: docs.json theme parity vs the design-tokens SSOT
        env:
          NIKA_DOCS_ROOT: ${{ github.workspace }}
        run: python3 ../spec/scripts/design-projector.py --check
